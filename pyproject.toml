[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-checker"
version = "1.0.0"
description = "DOT standards and workspace health auditor for OpenRoads/OpenBridge"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1"]

[project.scripts]
workspace-checker = "workspace_checker.cli:main"

[tool.setuptools.packages.find]
include = ["workspace_checker*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
